[project]
name = "relmap"
version = "0.1.0"
description = "Navegación relativista y mapa del espacio-tiempo (experimental)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "plotly", "pyyaml"]
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Pedro Sordo Martínez", email = "amurlaniakea@gmail.com" }]

[project.scripts]
relmap = "relmap.cli:main"
relmap-solar = "relmap.solar_cli:main"
relmap-pdf = "relmap.pdf_cli:main"

[project.optional-dependencies]
dev = ["pytest", "reportlab", "matplotlib", "ruff"]
pdf = ["reportlab", "matplotlib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
